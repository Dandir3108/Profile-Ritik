<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4faff" />
    <title>Ritik Dandir | JBM Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card-page">
      <div class="decor decor-left" aria-hidden="true"></div>
      <div class="decor decor-bottom" aria-hidden="true"></div>
      <div class="blueprint blueprint-right" aria-hidden="true"></div>
      <div class="blueprint blueprint-gear" aria-hidden="true"></div>

      <div class="card-shell">
        <figure class="portrait-wrap photo-container">
          <img class="portrait" src="./assets/Ritik%20Dandir.png" alt="Ritik Dandir" />
        </figure>

        <section class="profile" aria-labelledby="person-name">
          <header class="brand">
            <a href="https://jbmgroup.com" target="_blank" rel="noopener noreferrer" aria-label="Visit JBM Group website">
              <img src="./assets/jbm-logo.png" alt="JBM Group" />
            </a>
          </header>

          <div class="identity">
            <h1 id="person-name"><span>RITIK</span><span>DANDIR</span></h1>
            <div class="name-rule" aria-hidden="true"></div>
          </div>

          <div class="details" aria-label="Professional details">
            <div class="detail"><span class="icon pale" data-icon="user"></span><span>Executive</span></div>
            <div class="detail"><span class="icon pale" data-icon="settings"></span><span>Engineering</span></div>
            <div class="detail"><span class="icon pale" data-icon="building"></span><span>JBM Group</span></div>
          </div>

          <div class="contact" aria-label="Contact details">
            <a href="tel:+917974268544"><span class="icon solid" data-icon="phone"></span><span>+91 797-426-8544</span></a>
            <a href="mailto:Ritik.dandir@jbmgroup.com"><span class="icon solid" data-icon="mail"></span><span>Ritik.dandir@jbmgroup.com</span></a>
          </div>

          <nav class="actions" aria-label="Contact actions">
            <button class="action primary" id="save-contact" type="button"><span data-icon="contact"></span>Save Contact</button>
            <a class="action" href="tel:+917974268544"><span data-icon="phone"></span>Call</a>
            <a class="action" href="mailto:Ritik.dandir@jbmgroup.com"><span data-icon="mail"></span>Email</a>
            <button class="action" id="share-card" type="button"><span data-icon="share"></span>Share</button>
          </nav>
          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <script>
      function icon(name) {
        const paths = {
          user: '<circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.6-3.2 2.8-5 6.5-5s5.9 1.8 6.5 5"/>',
          settings: '<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.3 1.3 1-.9 1.6-1.6-.4a7.4 7.4 0 0 1-1.5 1.1l-.2 1.7h-1.9l-.7-1.6a7.4 7.4 0 0 1-1.8 0l-.7 1.6h-1.9l-.2-1.7a7.4 7.4 0 0 1-1.5-1.1l-1.6.4-.9-1.6 1.3-1a7.4 7.4 0 0 1 0-2.1l-1.3-1 .9-1.6 1.6.4A7.4 7.4 0 0 1 8 7.9l.2-1.7h1.9l.7 1.6a7.4 7.4 0 0 1 1.8 0l.7-1.6h1.9l.2 1.7a7.4 7.4 0 0 1 1.5 1.1l1.6-.4.9 1.6-1.3 1a7.4 7.4 0 0 1 0 2.1Z"/>',
          building: '<path d="M5 20V5h9v15M14 9h5v11M8 8h2M8 11h2M8 14h2M8 17h2M16 12h1M16 15h1M3 20h18"/>',
          phone: '<path d="M7.2 4.5 9.4 4l2 4-1.7 1.4a14.4 14.4 0 0 0 4.9 4.9l1.4-1.7 4 2-.5 2.2a2.6 2.6 0 0 1-2.9 2C10.8 17.8 6.2 13.2 5.2 7.4a2.6 2.6 0 0 1 2-2.9Z"/>',
          mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="1.7"/><path d="m4.5 7 7.5 5.7L19.5 7"/>',
          contact: '<path d="M9 4h6l1 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2l1-2Z"/><circle cx="12" cy="11" r="2"/><path d="M8.5 17c.4-1.8 1.6-2.7 3.5-2.7s3.1.9 3.5 2.7"/>',
          share: '<circle cx="18" cy="5" r="2.2"/><circle cx="6" cy="12" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="m8 11 7.8-4.5M8 13l7.8 4.5"/>'
        };
        return '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
      }
      document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); });

      const vcard = ['BEGIN:VCARD','VERSION:3.0','FN:Ritik Dandir','N:Ritik;Dandir;;;','ORG:JBM Group','TITLE:Executive, Engineering','TEL;TYPE=CELL:+917974268544','EMAIL:Ritik.dandir@jbmgroup.com','END:VCARD'].join('\\r\\n');
      const notice = document.getElementById('notice');
      document.getElementById('save-contact').addEventListener('click', () => {
        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'Ritik-Dandir.vcf'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      });
      document.getElementById('share-card').addEventListener('click', async () => {
        try {
          if (navigator.share) await navigator.share({ title: 'Ritik Dandir | JBM Group', text: 'Ritik Dandir, Executive - Engineering, JBM Group', url: window.location.href });
          else { await navigator.clipboard.writeText(window.location.href); notice.textContent = 'Link copied'; setTimeout(() => notice.textContent = '', 2200); }
        } catch (_) {}
      });
    </script>
  </body>
</html>
